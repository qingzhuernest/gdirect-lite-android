plugins {
    id 'com.android.application'
}

def buildRevision = providers.gradleProperty('buildRevision')
    .orElse(providers.environmentVariable('GITHUB_SHA')).getOrElse('local')
if (!(buildRevision ==~ /[A-Za-z0-9._-]{1,64}/)) {
    throw new GradleException('Invalid non-secret build revision')
}

android {
    namespace 'dev.gdirect.lite'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.gdirect.lite'
        minSdk 29
        targetSdk 35
        versionCode 24
        versionName '1.0.2-preview'
        buildConfigField 'String', 'REVISION', '"' + buildRevision + '"'
        resValue 'string', 'app_name', 'RouteShelf'
    }

    buildFeatures { buildConfig true }

    def testKeystore = providers.environmentVariable('GDIRECT_TEST_KEYSTORE_PATH').orNull
    if (testKeystore != null) {
        signingConfigs.debug.storeFile = file(testKeystore)
    }
    def previewKeystore = providers.environmentVariable('GDIRECT_PREVIEW_KEYSTORE_PATH').orNull
    signingConfigs {
        preview {
            if (previewKeystore != null) storeFile file(previewKeystore)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        preview {
            initWith debug
            applicationIdSuffix '.preview'
            signingConfig signingConfigs.preview
            matchingFallbacks = ['debug']
            resValue 'string', 'app_name', 'RouteShelf'
        }
    }
    // Compile/lint/test without a private key, but never emit an unsigned or randomly signed preview APK.
    tasks.configureEach { task ->
        if (task.name in ['validateSigningPreview', 'packagePreview']) task.doFirst {
            if (previewKeystore == null || !file(previewKeystore).isFile()) {
                throw new GradleException('Preview packaging requires the retained GDIRECT_PREVIEW_KEYSTORE_PATH. Do not generate a replacement key for an installed preview.')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    // Real JVM JSON implementation for testing the Android org.json model, not packaged in the APK.
    testImplementation 'com.vaadin.external.google:android-json:0.0.20131108.vaadin1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
}
